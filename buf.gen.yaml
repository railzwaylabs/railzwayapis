version: v2

# Keep the local module manifest used by Fare's development fallback. Generated
# sources remain ignored and are overwritten deterministically by each plugin.
clean: false

managed:
  enabled: true
  disable:
    - file_option: go_package_prefix
      module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: github.com/railzwaylabs/railzwayapis/gen/go

plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.30.0
    out: gen

inputs:
  - directory: .
